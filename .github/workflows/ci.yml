name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LBUG_VERSION: 0.18.2
  LBUG_SHARED: 1
  LBUG_LIB_KIND: shared

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Ladybug shared runtime
        shell: bash
        run: |
          lbug_dir="$RUNNER_TEMP/lbug-0.18.2"
          archive="$RUNNER_TEMP/liblbug-linux-x86_64.tar.gz"
          mkdir -p "$lbug_dir"
          curl -fSL "https://github.com/LadybugDB/ladybug/releases/download/v0.18.2/liblbug-linux-x86_64.tar.gz" -o "$archive"
          echo "210a018b17918a109b3b5f45326b8da9a7a21b926b2e6577312e033fae0373ef  $archive" | sha256sum --check --strict
          tar xzf "$archive" -C "$lbug_dir"
          test -f "$lbug_dir/liblbug.so"
          test -f "$lbug_dir/lbug.h"
          echo "LBUG_LIBRARY_DIR=$lbug_dir" >> "$GITHUB_ENV"
          echo "LBUG_INCLUDE_DIR=$lbug_dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lbug_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "$lbug_dir" >> "$GITHUB_PATH"

      # Toolchain (channel + components) is pinned by rust-toolchain.toml.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Layer rules from the root Cargo.toml diagram, enforced mechanically.
      - name: Crate layering
        run: python3 scripts/check_layering.py

      - name: Production retrieval runners self-test
        run: |
          python3 scripts/validate-retrieval-production.py --self-test
          python3 scripts/validate-retrieval-production-soak.py --self-test

      # The whole workspace is warning-clean; keep it that way. (The graph-
      # browser UI in cih-server's browser.rs/layout.rs is a live, tested
      # feature served at /graph — not dead code.)
      - name: Clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No test in the workspace requires FalkorDB/Postgres — unit and
      # artifact-fixture tests (e.g. taint::tests) run without services.
      - name: Test
        run: cargo test --workspace
