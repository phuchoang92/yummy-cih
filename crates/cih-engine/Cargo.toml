[package]
name = "cih-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "cih-engine"
path = "src/main.rs"

[dependencies]
cih-core.workspace = true
cih-taint.workspace = true
cih-patterns.workspace = true
cih-grouping.workspace = true
cih-community.workspace = true
cih-lang.workspace = true
cih-wiki.workspace = true
cih-embed = { workspace = true, optional = true }
cih-jar.workspace = true
cih-graph-store.workspace = true
cih-store-factory = { workspace = true, default-features = false }
cih-parse.workspace = true
cih-resolve.workspace = true
cih-search.workspace = true
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
globset.workspace = true
ignore.workspace = true
quick-xml.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zip.workspace = true
ureq = { version = "2", features = ["json"] }
dialoguer = "0.11"
indicatif.workspace = true
console.workspace = true
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["falkor", "semantic"]
# Keep the legacy external-service profile as the default for cih-engine.
falkor = ["cih-store-factory/falkor"]
# Opt-in embedded LadybugDB backend (adds the cih-ladybug adapter to the factory).
ladybug = ["cih-store-factory/ladybug"]
semantic = ["dep:cih-embed"]
